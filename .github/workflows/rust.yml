name: Rust port
on: [push, pull_request, workflow_dispatch]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A job here takes 2-5 minutes; a hang must not run to GitHub's six-hour
    # default, as every Windows job did on 2026-10-08 (loadngo IOCP defect 4).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --no-default-features

  speech-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shared: [OFF, ON]
    runs-on: ${{ matrix.os }}
    # A job here takes 2-5 minutes; a hang must not run to GitHub's six-hour
    # default, as every Windows job did on 2026-10-08 (loadngo IOCP defect 4).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 tools/generate_rust_tables.py --check
      - run: python3 tools/generate_rust_languages.py --check
      # Shared lanes exercise the C async API and optional MBROLA wrapper;
      # static lanes retain the synchronous-only configuration.
      - run: cmake -S . -B build-rust -DUSE_RUST_CORE=ON -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DUSE_ASYNC=${{ matrix.shared }} -DUSE_LIBPCAUDIO=OFF -DUSE_LIBSONIC=OFF -DUSE_MBROLA=${{ matrix.shared }}
      - run: cmake --build build-rust --parallel 3
      - run: ctest --test-dir build-rust --parallel 3 --output-on-failure
