name: Rust port
on: [push, pull_request, workflow_dispatch]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A job here takes 2-5 minutes; a hang must not run to GitHub's six-hour
    # default, as every Windows job did on 2026-10-08 (loadngo IOCP defect 4).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check native C-engine host adapters
        env:
          ESPEAK_NATIVE_HOST: "1"
        run: cargo clippy --locked --lib --all-features -- -D warnings
      # CI's CMake matrix builds 32-bit x86 and ARMv5 Linux and Win32 by default.
      - name: Check native C-engine host adapters on 32-bit targets
        if: runner.os == 'Linux'
        env:
          ESPEAK_NATIVE_HOST: "1"
        run: |
          rustup target add i686-unknown-linux-gnu armv5te-unknown-linux-gnueabi i686-pc-windows-msvc
          for target in i686-unknown-linux-gnu armv5te-unknown-linux-gnueabi i686-pc-windows-msvc; do
            cargo clippy --locked --lib --features c-abi,proactor --target "$target" -- -D warnings
          done
      - run: cargo test --locked --no-default-features

  speech-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shared: [OFF, ON]
    runs-on: ${{ matrix.os }}
    # A job here takes 2-5 minutes; a hang must not run to GitHub's six-hour
    # default, as every Windows job did on 2026-10-08 (loadngo IOCP defect 4).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 tools/generate_rust_tables.py --check
      - run: python3 tools/generate_rust_languages.py --check
      # The Linux shared lane speaks through a real mbrola program (Debian's
      # mbrola and its fr4 voice), so the Rust MBROLA wrapper's child process is
      # tested live; the C oracle workflow runs the same test on the C engine.
      - if: runner.os == 'Linux' && matrix.shared == 'ON'
        run: sudo apt-get update && sudo apt-get install -y mbrola mbrola-fr4
      # Shared lanes exercise the C async API and optional MBROLA wrapper;
      # static lanes retain the synchronous-only configuration.
      - run: cmake -S . -B build-rust -DUSE_RUST_CORE=ON -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DUSE_ASYNC=${{ matrix.shared }} -DUSE_LIBPCAUDIO=OFF -DUSE_LIBSONIC=OFF -DUSE_MBROLA=${{ matrix.shared }}
      - run: cmake --build build-rust --parallel 3
      # The engine's state is Rust's under C names such as "voice"; a shared
      # library must export only the public API (cmake/libespeak-ng.map).
      - name: The shared library exports only the public API
        if: runner.os == 'Linux' && matrix.shared == 'ON'
        run: |
          lib=$(find build-rust/src/libespeak-ng -maxdepth 1 -name 'libespeak-ng.so*' -type f | head -1)
          nm -D --defined-only "$lib" | awk '{print $3}' | sort -u > exports.txt
          echo "$lib exports $(wc -l < exports.txt) symbols"
          if grep -vE '^(espeak_[A-Z]|espeak_ng_[A-Z]|create_text_decoder$|destroy_text_decoder$|text_decoder_[a-z_]+$|GetFileLength$|strncpy0$|utf8_in$|LoadSpectSeq$|SpectSeqCreate$|SpectSeqDestroy$|param_defaults$|espeak_rs_cli_main$|_init$|_fini$)' exports.txt; then
            echo "libespeak-ng.so exports more than the public API"; exit 1
          fi
          [ "$(wc -l < exports.txt)" -ge 50 ]
      - run: ctest --test-dir build-rust --parallel 3 --output-on-failure
      - name: Live MBROLA (the Rust engine)
        if: runner.os == 'Linux' && matrix.shared == 'ON'
        env:
          ESPEAK_REQUIRE_MBROLA: "1"
        run: ctest --test-dir build-rust -R '^mbrola$' --no-tests=error -V
