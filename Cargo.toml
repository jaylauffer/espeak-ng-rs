[package]
name = "espeak-ng-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Native Rust migration of eSpeak NG's text and speech engine"
publish = false

[lib]
path = "rust/lib.rs"
crate-type = ["rlib", "staticlib"]

[[example]]
name = "hardware"
required-features = ["npu"]

[[example]]
name = "resident_data"
required-features = ["proactor"]

[features]
default = []
# Export the legacy C symbols only when replacing modules in the C engine.
c-abi = ["dep:libc"]
proactor = ["dep:loadngo-proactor"]
# Play through the system audio device (loadngo-audio-io).
audio = ["proactor", "dep:loadngo-audio-io"]
npu = ["proactor", "dep:loadngo-inference", "dep:loadngo-coreml"]

[dependencies]
libc = { version = "0.2.190", optional = true }
loadngo-proactor = { git = "https://github.com/jaylauffer/loadngo", rev = "6962d8a0a6e5ca51c66a5b547bf7faff9f0479d7", optional = true }
loadngo-audio-io = { git = "https://github.com/jaylauffer/loadngo", rev = "6962d8a0a6e5ca51c66a5b547bf7faff9f0479d7", optional = true }
loadngo-inference = { git = "https://github.com/jaylauffer/loadngo", rev = "6962d8a0a6e5ca51c66a5b547bf7faff9f0479d7", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
loadngo-coreml = { git = "https://github.com/jaylauffer/loadngo", rev = "6962d8a0a6e5ca51c66a5b547bf7faff9f0479d7", optional = true }

# AtomicU64 where the target has no 64-bit atomics (ARMv5, e.g. Debian armel);
# portable-atomic uses the Linux kernel's atomic helpers there.
[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = "1"

[profile.release]
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
